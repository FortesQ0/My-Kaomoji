name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          if [ -f my-kaomoji.zip ]; then unzip -oq my-kaomoji.zip; fi
          test -d my-kaomoji

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Сборка пишет журнал в build.log. Если она упала, ошибки Kotlin и Gradle выводятся
      # аннотациями на странице запуска и в сводке: их видно без входа в GitHub.
      - name: Собрать debug-APK
        working-directory: my-kaomoji
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E '^e: ' "$GITHUB_WORKSPACE/build.log" | head -10 | while IFS= read -r line; do
              echo "::error title=Kotlin::$line"
            done
            msg=$(grep -A8 'What went wrong' "$GITHUB_WORKSPACE/build.log" | head -12 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$msg" ]; then echo "::error title=Gradle::$msg"; fi
            {
              echo '### Ошибки сборки'
              echo '```'
              grep -E '^e: |What went wrong|Execution failed|error:' -A3 "$GITHUB_WORKSPACE/build.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Тесты библиотеки
        working-directory: my-kaomoji
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Переименовать APK
        run: cp my-kaomoji/app/build/outputs/apk/debug/app-debug.apk my-kaomoji.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-kaomoji-apk
          path: my-kaomoji.apk

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest my-kaomoji.apk \
            --title "Последняя сборка" \
            --notes "Debug-APK, собран из коммита ${GITHUB_SHA::7}" \
            --prerelease
