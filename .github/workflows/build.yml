name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Распаковать проект
        run: |
          if [ -f my-kaomoji.zip ]; then unzip -oq my-kaomoji.zip; fi
          test -d my-kaomoji

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.9

      # Постоянный ключ подписи, чтобы новая версия ставилась поверх старой.
      # Ключ лежит в signing/ в зашифрованном виде, пароль шифра хранится в секрете KEYSTORE_PASSPHRASE.
      # Если секрета нет, сборка идёт как раньше, со случайным debug-ключом.
      # Готовый APK подписывается этим ключом отдельным шагом ниже (apksigner), Gradle в этом не участвует.
      - name: Ключ подписи
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::warning title=Подпись::Секрет KEYSTORE_PASSPHRASE не задан, подпись случайным ключом"
            exit 0
          fi
          mkdir -p signing
          KS="$RUNNER_TEMP/kaomoji.keystore"
          if [ -f signing/debug.keystore.gpg ]; then
            printf '%s' "$KEYSTORE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -d -o "$KS" signing/debug.keystore.gpg
          else
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=My Kaomoji, O=My Kaomoji, C=US"
            printf '%s' "$KEYSTORE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 -o signing/debug.keystore.gpg "$KS"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore.gpg
            git commit -m "CI: постоянный ключ подписи (зашифрован)"
            git pull --rebase origin main
            git push origin main
          fi
          fp=$(keytool -list -v -keystore "$KS" -storepass android | grep 'SHA256:' | head -1 | sed 's/^ *//')
          echo "Отпечаток ключа подписи: $fp"
          echo "Отпечаток ключа подписи (SHA-256): ${fp#SHA256: }" >> "$GITHUB_STEP_SUMMARY"
          echo "KAOMOJI_KEYSTORE=$KS" >> "$GITHUB_ENV"

      # Сборка пишет журнал в build.log. Если она упала, ошибки Kotlin и Gradle выводятся
      # аннотациями на странице запуска и в сводке: их видно без входа в GitHub.
      - name: Собрать debug-APK
        working-directory: my-kaomoji
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E '^e: ' "$GITHUB_WORKSPACE/build.log" | head -10 | while IFS= read -r line; do
              echo "::error title=Kotlin::$line"
            done
            msg=$(grep -A8 'What went wrong' "$GITHUB_WORKSPACE/build.log" | head -12 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$msg" ]; then echo "::error title=Gradle::$msg"; fi
            {
              echo '### Ошибки сборки'
              echo '```'
              grep -E '^e: |What went wrong|Execution failed|error:' -A3 "$GITHUB_WORKSPACE/build.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Журнал сборки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Тесты библиотеки
        working-directory: my-kaomoji
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Переименовать APK
        run: cp my-kaomoji/app/build/outputs/apk/debug/app-debug.apk my-kaomoji.apk

      - name: Подписать постоянным ключом
        run: |
          if [ -z "$KAOMOJI_KEYSTORE" ]; then exit 0; fi
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning title=Подпись::apksigner не найден, APK подписан случайным ключом"
            exit 0
          fi
          "$apksigner" sign --ks "$KAOMOJI_KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android my-kaomoji.apk
          sha=$("$apksigner" verify --print-certs my-kaomoji.apk | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "::notice title=Подпись::SHA-256 сертификата APK: $sha"
          echo "Сертификат APK (SHA-256): $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-kaomoji-apk
          path: my-kaomoji.apk

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest my-kaomoji.apk \
            --title "Последняя сборка" \
            --notes "Debug-APK, собран из коммита ${GITHUB_SHA::7}" \
            --prerelease
